# Nginx: sirve el frontend y hace de proxy hacia la API activa.
#
# El upstream se define en un fichero aparte de una sola linea.
# Conmutar el trafico = reescribir ese fichero y recargar.
upstream calcula_api {
    include /etc/nginx/conf.d/calcula-activo.inc;
}

server {
    listen 80 default_server;
    server_name _;

    # Frontend: el symlink apunta al color activo.
    root /opt/calcula/current-web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://calcula_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    location /actuator/ {
        proxy_pass http://calcula_api;
        proxy_connect_timeout 2s;
    }
}
