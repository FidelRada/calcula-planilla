spring.application.name=calcula-api

# Maven sustituye @project.version@ al empaquetar: el jar no puede
# mentir sobre que version es.
app.version=@project.version@

# Identidad de la instancia. La pone systemd por variables de entorno,
# no el codigo: el mismo jar sirve para BLUE y para GREEN.
app.instance=${APP_INSTANCE:LOCAL}
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Reglas de planilla -------------------------------------------
# Valores de ejemplo, NO una fuente legal. Las pruebas fijan la logica
# (donde cortan los escalones, que el tope se aplique), no las cifras.
planilla.salario-minimo=2750
planilla.tasa-afp=0.1271
planilla.tope-afp-minimos=60
planilla.tasa-rc-iva=0.13
planilla.minimos-exentos=2
# Meses minimos trabajados para devengar aguinaldo.
planilla.meses-minimos-aguinaldo=3
